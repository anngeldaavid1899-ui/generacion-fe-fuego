:root{--bg:#120907;--card:#1d100c;--line:#3a2119;--tx:#f8ede7;--mut:#b99a8d;--fire:#ff6a2b;--fire2:#c0392b}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#3a1409,var(--bg) 60%) fixed;color:var(--tx);min-height:100vh;padding-bottom:40px}

header img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 18px #ff6a2b88)}

header p{color:var(--mut);letter-spacing:.2em;font-size:12px;text-transform:uppercase;margin-top:4px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:18px 12px 6px;position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);z-index:5}
nav button{background:var(--card);color:var(--mut);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;border-color:transparent}
main{max-width:980px;margin:12px auto;padding:0 14px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h2{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#ffb36b;margin-bottom:14px}
.towers{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,3vw,28px);height:380px;padding-top:30px;border-bottom:3px solid var(--line)}
.tw{flex:1;max-width:130px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tw .n{font-size:26px;font-weight:800;margin-bottom:4px}
.tw .crown{height:22px;font-size:18px}
.tw .bar{width:100%;border-radius:10px 10px 0 0;display:flex;flex-direction:column-reverse;overflow:hidden;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 22px var(--c)}
.tw .bar i{display:block;border-top:1px solid #0006;min-height:0}
.names{display:flex;justify-content:center;gap:clamp(8px,3vw,28px);margin-top:8px}
.names div{flex:1;max-width:130px;text-align:center;font-weight:700;font-size:14px}
.names small{display:block;color:var(--mut);font-weight:400}
.leg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;font-size:12px;color:var(--mut)}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:#ff8a4d;margin-right:5px;opacity:var(--o)}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:5px}
select,input[type=date],input[type=text],input[type=number]{width:100%;background:#120907;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:14px 0}
.st{display:flex;align-items:center;gap:8px;background:#120907;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.st b{flex:1;font-size:14px}
.st button{width:36px;height:36px;border-radius:10px;border:0;background:var(--line);color:var(--tx);font-size:20px;cursor:pointer}
.st button:active{background:var(--fire)}
.st input{width:56px;text-align:center;padding:8px}
.btn{background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;border:0;border-radius:12px;padding:13px 22px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.btn.alt{background:var(--line);color:var(--tx)}.btn.red{background:#5a1a14}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:#ffb36b;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td:first-child,th:first-child{text-align:left}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.tot{font-weight:800;font-size:16px;color:#ffb36b}
.x{background:none;border:0;color:#ff7b6b;cursor:pointer;font-size:16px}
.tm{display:grid;grid-template-columns:44px 1fr 1fr 40px;gap:8px;margin-bottom:8px;align-items:center}
.tm input[type=color]{width:44px;height:42px;padding:2px;border-radius:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#2b1812;border:1px solid var(--fire);padding:12px 20px;border-radius:12px;transition:.3s;z-index:9}
.toast.show{transform:translateX(-50%)}
.empty{color:var(--mut);text-align:center;padding:20px}
@media(max-width:560px){.g2{grid-template-columns:1fr}.towers{height:300px}}
.pill{display:inline-block;margin-top:10px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--mut)}
nav .alt{border-style:dashed}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--fire);border-radius:16px;padding:22px;max-width:340px;width:90%;margin:auto}
dialog::backdrop{background:#000a}
#pwErr{color:#ff7b6b;font-size:13px;min-height:18px;margin-top:6px}
</style></head>

<script>

const FB={

/* Correo del usuario líder que creas en Firebase > Authentication (la clave es el PIN) */
const LEADER_EMAIL="lideres@generaciondefuego.com";
/* ================================================================================ */
const CATS=['Puntualidad','Asistencia','Participación','Integración','Disciplina','Preguntas'];
const KEY='gdf-puntos-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const col=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#888888';
const DEF=()=>[
{id:1,name:'Diana',cn:'Rosa',color:'#ff5fa2'},{id:2,name:'Dolo',cn:'Blanco',color:'#f4f4f4'},
{id:3,name:'Liriam',cn:'Azul',color:'#3b82f6'},{id:4,name:'Arturo',cn:'Amarillo',color:'#facc15'},
{id:5,name:'Esthefy',cn:'Verde',color:'#34d399'}];
const ONLINE=!/PEGA_AQUI/.test(FB.apiKey)&&typeof firebase!=='undefined';
let S={teams:[],log:[]},db=null,auth=null,leader=false,loaded=false;
const canEdit=()=>!ONLINE||leader;
const save=()=>{if(ONLINE)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
const tname=id=>S.teams.find(x=>x.id===id)||{name:'(eliminado)',cn:'',color:'#888888'};
const fail=e=>toast(e&&e.code==='PERMISSION_DENIED'?'Sin permiso: entra como líder':'No se pudo guardar: revisa la conexión');

function totals(){return S.teams.map(t=>{const c=CATS.map(()=>0);S.log.forEach(e=>{if(e.team===t.id)e.p.forEach((v,i)=>c[i]+=v)});return{t,c,total:c.reduce((a,b)=>a+b,0)}})}
function ranks(T){return T.map(x=>1+T.filter(y=>y.total>x.total).length)}

function renderTowers(){
 const T=totals(),R=ranks(T),max=Math.max(1,...T.map(x=>x.total));
 $('#tw').innerHTML=T.map((x,i)=>`<div class="tw"><div class="crown">${x.total>0&&R[i]===1?'👑':''}</div><div class="n" style="color:${x.t.color}">${x.total}</div><div class="bar" data-h="${x.total/max*100}" style="--c:${x.t.color}66">${x.c.map((v,k)=>`<i title="${CATS[k]}: ${v}" style="flex:${v};background:${x.t.color};opacity:${1-k*.1}"></i>`).join('')}</div></div>`).join('');
 $('#nm').innerHTML=T.map((x,i)=>`<div>${esc(x.t.name)}<small>${esc(x.t.cn)} · #${R[i]}</small></div>`).join('');
 $('#lg').innerHTML=CATS.map((c,k)=>`<span style="--o:${1-k*.1}">${c}</span>`).join('');
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.bar').forEach(b=>b.style.height=Math.max(+b.dataset.h*.85,b.dataset.h>0?3:0)+'%')));
}
function renderTable(){
 const T=totals(),R=ranks(T);
 $('#tb').innerHTML=`<tr><th>Equipo</th>${CATS.map(c=>`<th>${c}</th>`).join('')}<th>Total</th><th>Puesto</th></tr>`+
 T.map((x,i)=>`<tr><td><span class="dot" style="background:${x.t.color}"></span>${esc(x.t.name)} <small style="color:var(--mut)">${esc(x.t.cn)}</small></td>${x.c.map(v=>`<td>${v}</td>`).join('')}<td class="tot">${x.total}</td><td>${R[i]===1&&x.total>0?'🥇':R[i]}</td></tr>`).join('');
}
function renderLog(){
 const L=[...S.log].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),ce=canEdit();
 $('#hs').innerHTML=L.length?`<tr><th>Fecha</th><th>Equipo</th>${CATS.map(c=>`<th>${c.slice(0,5)}.</th>`).join('')}<th>Total</th><th>Nota</th>${ce?'<th></th>':''}</tr>`+
 L.map(e=>{const t=tname(e.team);return`<tr><td>${esc(e.date).split('-').reverse().join('/')}</td><td><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</td>${e.p.map(v=>`<td>${v}</td>`).join('')}<td class="tot">${e.p.reduce((a,b)=>a+b,0)}</td><td style="text-align:left;white-space:normal">${esc(e.note||'')}</td>${ce?`<td><button class="x" data-del="${e.id}" title="Borrar">✕</button></td>`:''}</tr>`}).join('')
 :'<tr><td class="empty">Todavía no hay registros.</td></tr>';
}
function renderSelect(){const v=$('#fTeam').value;$('#fTeam').innerHTML=S.teams.map(t=>`<option value="${t.id}">${esc(t.name)} (${esc(t.cn)})</option>`).join('');if(v)$('#fTeam').value=v}
function renderTeams(){
 $('#tms').innerHTML=S.teams.map(t=>`<div class="tm" data-id="${t.id}"><input type="color" value="${t.color}" data-f="color"><input type="text" value="${esc(t.name)}" data-f="name" placeholder="Mentor"><input type="text" value="${esc(t.cn)}" data-f="cn" placeholder="Color"><button class="x" data-rm="${t.id}" title="Eliminar">🗑</button></div>`).join('');
}
const all=()=>{renderTowers();renderTable();renderLog();renderSelect()};
function go(s){document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));const b=document.querySelector(`nav [data-s=${s}]`);if(b)b.classList.add('on');$('#'+s).classList.add('on');if(s==='torres')renderTowers();if(s==='equipos')renderTeams()}
function mode(){
 const ce=canEdit();
 document.querySelectorAll('[data-s=registrar],[data-s=equipos]').forEach(b=>b.style.display=ce?'':'none');
 $('#rst').style.display=ce?'':'none';
 $('#lb').style.display=ONLINE?'':'none';
 $('#lb').textContent=leader?'🔓 Salir (líder)':'🔒 Acceso líderes';
 $('#pill').textContent=!ONLINE?'⚪ Modo local · sin conexión a Firebase':(leader?'🟢 En vivo · modo líder':'🟢 En vivo · solo lectura');
 if(!ce){const on=document.querySelector('section.on');if(on&&(on.id==='registrar'||on.id==='equipos'))go('torres')}
}
function seed(){if(ONLINE&&leader&&loaded&&!S.teams.length){const o={};DEF().forEach(t=>o[t.id]=t);db.ref('gdf/teams').set(o).catch(fail)}}

/* ---- operaciones (en línea o local) ---- */
function opAddLog(e){if(ONLINE)db.ref('gdf/log/'+e.id).set(e).catch(fail);else{S.log.push(e);save();all()}}
function opDelLog(id){if(ONLINE)db.ref('gdf/log/'+id).remove().catch(fail);else{S.log=S.log.filter(x=>x.id!==id);save();all()}}
function opTeam(id,f,v){const t=S.teams.find(x=>x.id===id);if(t)t[f]=v;if(ONLINE)db.ref('gdf/teams/'+id+'/'+f).set(v).catch(fail);else save();renderTowers();renderTable();renderLog();renderSelect()}
function opAddTeam(){const id=Math.max(0,...S.teams.map(t=>t.id))+1,cols=['#fb923c','#a78bfa','#22d3ee','#f87171'];const t={id,name:'Nuevo mentor',cn:'Color',color:cols[id%4]};
 if(ONLINE){db.ref('gdf/teams/'+id).set(t).catch(fail);setTimeout(renderTeams,80)}else{S.teams.push(t);save();all();renderTeams()}}
function opRmTeam(id){
 if(ONLINE){const u={};u['gdf/teams/'+id]=null;S.log.filter(l=>l.team===id).forEach(l=>u['gdf/log/'+l.id]=null);db.ref().update(u).catch(fail);setTimeout(renderTeams,80)}
 else{S.teams=S.teams.filter(t=>t.id!==id);S.log=S.log.filter(l=>l.team!==id);save();all();renderTeams()}}
function opReset(){if(ONLINE)db.ref('gdf/log').remove().catch(fail);else{S.log=[];save();all()}}

/* ---- formulario ---- */
$('#cats').innerHTML=CATS.map((c,i)=>`<div class="st"><b>${c}</b><button type="button" data-i="${i}" data-d="-1">−</button><input type="number" id="c${i}" value="0" min="0" max="100"><button type="button" data-i="${i}" data-d="1">+</button></div>`).join('');
$('#cats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=$('#c'+b.dataset.i);i.value=Math.max(0,(+i.value||0)+ +b.dataset.d)});
const clearForm=()=>{CATS.forEach((_,i)=>$('#c'+i).value=0);$('#fNote').value=''};
$('#fDate').value=today();
$('#clr').onclick=clearForm;
$('#save').onclick=()=>{
 const p=CATS.map((_,i)=>Math.max(0,Math.round(+$('#c'+i).value||0)));
 if(!S.teams.length)return toast('Primero crea un equipo');
 if(!p.some(v=>v>0))return toast('Pon al menos un punto');
 const team=+$('#fTeam').value;
 opAddLog({id:Date.now(),date:$('#fDate').value||today(),team,p,note:$('#fNote').value.trim()});
 clearForm();toast('✔ Puntos guardados para '+tname(team).name);
};
$('#hs').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b&&confirm('¿Borrar este registro?'))opDelLog(+b.dataset.del)});
$('#tms').addEventListener('input',e=>{const r=e.target.closest('.tm');if(r)opTeam(+r.dataset.id,e.target.dataset.f,e.target.value)});
$('#tms').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b&&confirm('¿Eliminar este equipo y todos sus puntos?'))opRmTeam(+b.dataset.rm)});
$('#addT').onclick=opAddTeam;
$('#rst').onclick=()=>{if(confirm('Se borrarán TODOS los puntos (los equipos se mantienen). ¿Continuar?')){opReset();toast('Puntos reiniciados')}};
$('#csv').onclick=()=>{
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=[['Fecha','Equipo',...CATS,'Total','Nota'].map(q).join(';')];
 S.log.forEach(e=>rows.push([e.date,tname(e.team).name,...e.p,e.p.reduce((a,b)=>a+b,0),e.note||''].map(q).join(';')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='generacion-de-fuego-puntos.csv';a.click();
};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(b)go(b.dataset.s)});

/* ---- acceso de líderes ---- */
$('#lb').onclick=()=>{if(leader){auth.signOut();toast('Sesión de líder cerrada');return}$('#pw').value='';$('#pwErr').textContent='';$('#dlg').showModal();setTimeout(()=>$('#pw').focus(),50)};
$('#dlgX').onclick=()=>$('#dlg').close();
$('#dlgForm').onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(LEADER_EMAIL,$('#pw').value);$('#dlg').close();toast('✔ Acceso de líder activado')}catch(err){$('#pwErr').textContent='Clave incorrecta o sin conexión'}};

/* ---- arranque ---- */
function norm(){S.teams=S.teams.map(t=>({id:+t.id,name:String(t.name||''),cn:String(t.cn||''),color:col(t.color)}));
 S.log=S.log.map(e=>({id:+e.id,date:String(e.date||''),team:+e.team,note:String(e.note||''),p:CATS.map((_,i)=>+((e.p||[])[i])||0)}))}
if(!ONLINE){
 try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.teams)S=j}catch(e){}
 if(!S.teams.length)S.teams=DEF();
 norm();loaded=true;mode();all();renderTeams();
}else{
 mode();
 try{
  firebase.initializeApp(FB);db=firebase.database();auth=firebase.auth();
  db.ref('gdf').on('value',s=>{const v=s.val()||{};S.teams=Object.values(v.teams||{}).sort((a,b)=>a.id-b.id);S.log=Object.values(v.log||{});norm();loaded=true;all();seed()},()=>{$('#pill').textContent='🔴 Sin conexión con la base de datos'});
  auth.onAuthStateChanged(u=>{leader=!!u&&u.email===LEADER_EMAIL;mode();all();seed()});
 }catch(e){$('#pill').textContent='🔴 Error de configuración de Firebase'}
}
</script></body></html>
